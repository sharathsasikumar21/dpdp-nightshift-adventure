<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../release-ui.css"><body><select id="case"></select><button id="open">Open board</button><script type="module">import{showEvidence}from'../investigation.js';import{dossiers}from'../case-content.js';const stories=await(await fetch('../stories.json')).json();window.auditCases=stories.map(s=>({id:s.id,title:s.title,clues:dossiers[s.id].clues}));document.querySelector('#case').innerHTML=stories.map((s,i)=>'<option value="'+i+'">'+s.title+'</option>').join('');document.querySelector('#open').onclick=()=>{const s=stories[Number(document.querySelector('#case').value)],found=new Set();showEvidence(s,found,i=>found.add(i));};</script>
