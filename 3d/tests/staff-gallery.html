<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#101c27;color:#e4e8df;font:14px Arial}main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px}article{border:1px solid #627d83;background:#152531}img{width:100%;display:block}h2,p{margin:12px 18px}p{font-size:12px;color:#b8c6c9}</style><main></main><script type="module">import*as T from'../vendor/three.module.js';import{addStaffRoster}from'../staff-roster.js';const scene=new T.Scene();scene.background=new T.Color('#22323e');scene.add(new T.HemisphereLight('#eff1dd','#4d5767',2));const key=new T.DirectionalLight('#ffe3be',2.2);key.position.set(3,5,4);scene.add(key);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(500,420);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;const camera=new T.PerspectiveCamera(32,500/420,.1,30);camera.position.set(2.5,1.5,4.3);camera.lookAt(0,.87,0);const roster=addStaffRoster(scene,[]);for(const floor of[47,48,49,50]){roster.setFloor(floor);await Promise.all(roster.members.filter(m=>m.profile.floor===floor).map(m=>m.loading));}for(const m of roster.members){for(const other of roster.members)other.group.visible=other===m;m.group.position.set(0,0,0);m.group.rotation.y=.35;m.actions.idle?.play();m.mixer?.setTime(.8);renderer.render(scene,camera);const card=document.createElement('article');card.innerHTML='<img alt="'+m.profile.name+'" src="'+renderer.domElement.toDataURL()+'"><h2>'+m.profile.name+'</h2><p>'+m.profile.gender+' · '+m.profile.role+'</p>';document.querySelector('main').append(card);}window.galleryReady=true;</script>
