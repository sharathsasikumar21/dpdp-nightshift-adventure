function updateHud(){const d=missionDefs[state.run[state.mission]??state.run[0]];$('#rank').textContent=rankFor(state.totalPoints);$('#points').textContent=state.totalPoints;$('#score').textContent=state.score;$('#counter').textContent=state.active?`${state.completed+1}/15`:'—';$('#active-title').textContent=d?d.title:'Awaiting assignment';$('#active-copy').textContent=d?`Mission ${state.mission+1} of ${state.run.length} · ${d.plot[Math.min(state.step,2)]}`:'Move through the operations floor and find the glowing case terminal.';$('#loc').textContent=d?`CASE ${String(state.run[state.mission]+1).padStart(2,'0')} // ${state.step<3?'EVIDENCE ROOM':'REVIEW'}`:'CONTROL ROOM';$('#mission-rows').innerHTML=state.run.map((id,i)=>`<div class="mission-row ${i<state.mission?'done':i===state.mission?'current':''}"><span class="dot"></span><span>${missionDefs[id].title}</span></div>`).join('')}
function showStart(){overlay.innerHTML=`<section class="modal"><div class="eyebrow">FIELD TRAINING // INDIA · DPDP ACT</div><h1>THE NIGHTSHIFT<br><span style="color:var(--green)">MISSIONS</span></h1><p class="lede">A privacy incident is unfolding across the city. Walk the operations floor, examine ten live cases and make decisions under pressure. Your choices shape what happens next—and the team will tell you exactly where you went wrong.</p><p>Each run draws five story missions from a ten-story campaign. Three decisions per mission. Fifteen calls before dawn. Mission order and unused cases carry across this browser.</p><div class="online-box"><div class="mono">ONLINE CASE ROOM // OPTIONAL</div><div class="online-row"><button class="btn secondary" id="create-room">CREATE ROOM</button><input id="room-code" maxlength="12" placeholder="ROOM CODE" aria-label="Online room code"><button class="btn secondary" id="join-room">JOIN ROOM</button></div><div class="online-status" id="online-status">Play solo, or open a room to compare live decisions and points with your team.</div></div><div class="btnrow"><button class="btn" id="start">BEGIN SHIFT →</button><button class="btn secondary" id="reset">RESET LOCAL RUN HISTORY</button></div><div class="hintline">WASD / ARROWS TO MOVE · E TO OPEN A CASE · MOBILE D-PAD SUPPORTED</div><div class="hintline" style="color:#758583">Educational simulation, not legal advice. The game uses saved progress in this browser only.</div></section>`;$('#start').onclick=startRun;$('#create-room').onclick=createRoom;$('#join-room').onclick=()=>connectRoom($('#room-code').value);$('#reset').onclick=()=>{saved={seen:[],score:50,runs:0};persist();toastMsg('Local case history cleared. Fresh shift, fresh mistakes.');};}
function startRun(){if(bank.length<30){overlay.innerHTML=`<section class="modal"><h2>Case archive unavailable</h2><p>The DPDP case file did not load. Open this game from a web host that serves scenarios.json alongside index.html.</p></section>`;return}let unseen=missionDefs.map((_,i)=>i).filter(i=>!saved.seen.includes(i));if(unseen.length<5){overlay.innerHTML=`<section class="modal"><div class="eyebrow">CASE ARCHIVE COMPLETE</div><h2>You’ve worked every case.</h2><p>All ten story missions have already been used on this browser. Clear local run history to start a fresh campaign; your previous learning record stays on this device until you choose to reset it.</p><div class="btnrow"><button class="btn" id="clear">CLEAR HISTORY & START OVER</button></div></section>`;$('#clear').onclick=()=>{saved.seen=[];saved.runs=0;persist();startRun()};return}for(let i=unseen.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[unseen[i],unseen[j]]=[unseen[j],unseen[i]]}state.run=unseen.slice(0,5);saved.seen.push(...state.run);saved.runs++;persist();state.active=true;state.mission=0;state.step=0;state.score=50;state.runScore=0;state.completed=0;state.runPoints=0;state.streak=0;state.lastOutcome='';startAmbient();cue('case');overlay.classList.add('hidden');updateHud();toastMsg('Shift live. Find a pulsing case terminal.');}
function safeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openDecision(){if(!state.active||state.interacting)return;const id=state.run[state.mission],d=missionDefs[id],src=byId.get(d.ids[state.step]);if(!src)return;state.interacting=true;let options=[{text:src.a,good:true},...src.bad.map(text=>({text,good:false}))];for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}overlay.classList.remove('hidden');const keys=['A','B','C','D'];const bridge=state.lastOutcome?`<div class="result ${state.lastOutcome.good?'good':''}"><span class="mono">WHAT YOUR LAST CALL CHANGED</span><p>${safeText(state.lastOutcome.consequence)}</p></div>`:'';overlay.innerHTML=`<section class="modal"><div class="eyebrow">MISSION ${state.mission+1}/${state.run.length} · DECISION ${state.step+1}/3</div><h2>${safeText(d.title)}</h2>${bridge}<p>${safeText(d.plot[state.step])}</p><p style="font-size:16px;font-weight:700;color:var(--text);line-height:1.5">${safeText(src.q)}</p><span class="tag">${safeText(src.tag)}</span><div class="choice-list">${options.map((o,i)=>`<button class="choice" data-i="${i}"><span class="key">${keys[i]}</span><span>${safeText(o.text)}</span></button>`).join('')}</div><div class="hintline">Pick the response that protects people and can survive the morning review.</div></section>`;overlay.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>resolve(options[i],b,src,d));}
function resolve(opt,btn,src,d){if(!state.interacting)return;state.interacting=false;btn.classList.add('chosen');const delta=opt.good?8:-14,pointDelta=opt.good?100+(state.streak>=2?25:0):-40;state.streak=opt.good?state.streak+1:0;state.score=Math.max(0,Math.min(100,state.score+delta));state.runPoints+=pointDelta;state.totalPoints=Math.max(0,state.totalPoints+pointDelta);saved.totalPoints=state.totalPoints;state.runScore+=opt.good?1:0;state.completed++;cue(opt.good?'right':'wrong');persist();let consequence=opt.good?'You contained this risk. The audit trail records a defensible decision and the affected people keep meaningful control.':wrongConsequence(src);state.lastOutcome={good:opt.good,consequence};if(online.channel){online.channel.track({alias:online.alias,points:state.runPoints,correct:state.runScore}).catch(()=>{});online.channel.send({type:'broadcast',event:'decision',payload:{guestId,alias:online.alias,good:opt.good,points:state.runPoints,mission:state.mission+1,decision:state.step+1}}).catch(()=>{})}updateHud();overlay.innerHTML=`<section class="modal"><div class="eyebrow">${opt.good?'COMPLIANT RESPONSE // NICE WORK':'DECISION REVIEW // THE AUDIT LOG SAW THAT'}</div><h2>${opt.good?'A clean move.':'That call creates a problem.'}</h2><div class="result ${opt.good?'good':''}"><span class="mono">${opt.good?'WHY IT WORKS':'WHAT WENT WRONG'}</span><p>${opt.good?src.why:`${opt.text} fails because ${src.why.charAt(0).toLowerCase()+src.why.slice(1)}`}</p><p><strong>Consequence:</strong> ${consequence}</p><p class="legal">LEGAL FILE · ${src.law}</p></div><p style="font-size:12px;color:var(--muted)">Integrity ${delta>0?'+':''}${delta} · Points ${pointDelta>0?'+':''}${pointDelta} · Total ${state.totalPoints} · Level: ${rankFor(state.totalPoints)}</p><div class="btnrow"><button class="btn" id="continue">${state.completed===15?'END SHIFT →':state.step===2?'CLOSE CASE →':'NEXT DECISION →'}</button></div></section>`;$('#continue').onclick=nextStep;}
function wrongConsequence(src){const t=(src.tag||'').toLowerCase();if(t.includes('child'))return'Children may face prohibited tracking or targeted ads; the fiduciary risks enforcement and loses family trust.';if(t.includes('breach')||t.includes('security'))return'Exposure continues or affected people remain unaware, increasing harm, regulatory scrutiny and recovery cost.';if(t.includes('withdraw')||t.includes('consent'))return'Processing continues without valid permission or becomes impossible to justify; the consent record will not rescue it.';if(t.includes('retention')||t.includes('purpose'))return'Data outlives its purpose or gets reused unexpectedly, expanding exposure and undermining user control.';if(t.includes('processor')||t.includes('vendor'))return'An outside party can misuse or expose data while the fiduciary still carries compliance responsibility.';if(t.includes('rights')||t.includes('grievance')||t.includes('correction'))return'The person cannot exercise rights or correct a harmful record; unresolved complaints escalate.';return'The organization processes data without a defensible basis, increases exposure, and has to explain the decision to affected people and regulators.'}
function nextStep(){if(state.completed>=15){finishRun();return}if(state.step<2){state.step++;state.interacting=false;overlay.classList.add('hidden');updateHud();return}state.step=0;state.mission++;state.interacting=false;if(state.mission>=state.run.length){finishRun();return}state.lastOutcome=null;const id=state.run[state.mission],[x,z]=positions[id];state.player.set(x,0,z+2.6);camera.position.set(x,1.7,z+2.6);state.yaw=0;updateHud();overlay.classList.add('hidden');toastMsg('Case closed. Next lead added to your map.');}
async function submitOnlineScore(){if(!supabaseClient)return{error:'Online database is not configured.'};try{const points=Math.max(0,Math.min(1875,state.runPoints));const {error}=await supabaseClient.from('nightshift_scores').insert({nickname:online.alias,points,decisions_correct:state.runScore,missions_completed:Math.ceil(state.completed/3)});if(error)return{error:error.message};const {data, error:readError}=await supabaseClient.from('nightshift_scores').select('nickname,points,missions_completed,created_at').order('points',{ascending:false}).order('created_at',{ascending:true}).limit(5);return readError?{error:readError.message,data:null}:{data:data||[]}}catch(e){return{error:e?.message||'Could not reach the online database.'}}}
async function finishRun(){state.active=false;persist();let level=rankFor(state.totalPoints);cue('close');overlay.classList.remove('hidden');const onlineResult=await submitOnlineScore();const leaderboard=onlineResult.data?`<div class="result"><span class="mono">GLOBAL NIGHTSHIFT BOARD</span><p>${onlineResult.data.length?onlineResult.data.map((p,i)=>`${i+1}. ${safeText(p.nickname)} — ${p.points} pts`).join('<br>'):'No scores yet. You opened the board.'}</p></div>`:`<p class="hintline">Online score not saved yet: ${safeText(onlineResult.error||'Database setup pending.')}</p>`;overlay.innerHTML=`<section class="modal"><div class="eyebrow">SHIFT REPORT // CASES CLOSED</div><h1>DAWN REVIEW</h1><div class="scorebig">${state.totalPoints}<span style="font-size:14px;color:var(--muted)"> TOTAL POINTS</span></div><p>Shift points: ${state.runPoints} · Integrity: ${state.score}/100</p><h2 style="color:var(--cyan)">${level}</h2><p>You completed ${state.completed} decisions across five stories. ${state.runScore} decisions were compliant on the first call. The review notes, legal references and consequences appeared at each decision so you could see the impact as the night unfolded.</p>${leaderboard}<div class="result good"><span class="mono">WHAT YOU LEARNED</span><p>Purpose and notice first. Collect only what is needed. Make withdrawal usable. Protect children. Govern processors. Secure and report breaches. Enable rights and grievances. Erase data when its purpose ends. Keep evidence and limit access.</p><p class="legal">DPDP ACT, 2023 · DPDP RULES, 2025 · CHECK CURRENT COMMENCEMENT AND APPLICABILITY</p></div><div class="btnrow"><button class="btn" id="again">START ANOTHER SHIFT →</button><button class="btn secondary" id="home">RETURN TO CONTROL ROOM</button></div><div class="hintline">Completed story arcs are saved on this browser and will not be drawn again here.</div></section>`;$('#again').onclick=startRun;$('#home').onclick=()=>{overlay.classList.add('hidden');state.active=false;updateHud();};}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1900)}
showStart();updateHud();
const down=e=>{const k=e.key.toLowerCase();state.keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='e'||k===' ')interact();if(k==='escape'&&state.interacting){state.interacting=false;overlay.classList.add('hidden')}};const up=e=>state.keys[e.key.toLowerCase()]=false;addEventListener('keydown',down);addEventListener('keyup',up);$('#mobile-interact').onclick=interact;$('#sound-toggle').onclick=()=>{sound.on=!sound.on;$('#sound-toggle').textContent=sound.on?'♪ SOUND ON':'♪ SOUND OFF';if(sound.on)startAmbient();else if(sound.ctx)sound.master.gain.setTargetAtTime(0,sound.ctx.currentTime,.08)};
function interact(){if(state.interacting)return;if(!state.active){if(!overlay.classList.contains('hidden'))return;return}if(state.near>=0){cue('case');openDecision()}else toastMsg('Move closer to a glowing case terminal.');}
document.querySelectorAll('[data-move]').forEach(b=>{const dir=b.dataset.move;const keymap={forward:'w',back:'s',left:'a',right:'d'};b.onpointerdown=e=>{e.preventDefault();state.keys[keymap[dir]]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>state.keys[keymap[dir]]=false))});
let dragging=false,lastX=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===2){dragging=true;lastX=e.clientX;}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){state.yaw-=(e.clientX-lastX)*.004;lastX=e.clientX}});renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
function clampPlayer(p){p.x=THREE.MathUtils.clamp(p.x,-10.8,10.8);p.z=THREE.MathUtils.clamp(p.z,-10.8,10.8);for(const b of blockers){if(Math.abs(p.x-b.x)<b.w/2+.35&&Math.abs(p.z-b.z)<b.d/2+.35){const dx=p.x-b.x,dz=p.z-b.z;if(Math.abs(dx)>Math.abs(dz))p.x=b.x+Math.sign(dx||1)*(b.w/2+.38);else p.z=b.z+Math.sign(dz||1)*(b.d/2+.38)}}}
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);for(let i=0;i<stations.length;i++){let s=stations[i];s.orb.position.y=s.orb.userData.baseY+Math.sin(performance.now()*.002+i)*.09;s.orb.rotation.y+=dt*.7;s.orb.material=state.active&&state.run[state.mission]===i?greenMat:inactiveMat}
let f=0,s=0;if(state.keys.w||state.keys.arrowup)f++;if(state.keys.s||state.keys.arrowdown)f--;if(state.keys.d||state.keys.arrowright)s++;if(state.keys.a||state.keys.arrowleft)s--;if(f||s){let v=new THREE.Vector3(s,0,-f).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),state.yaw);state.player.addScaledVector(v,dt*4.2);clampPlayer(state.player)}
const targetYaw=Math.atan2(state.player.x, state.player.z);avatar.position.set(state.player.x,0,state.player.z);avatar.rotation.y=state.yaw+Math.PI;
camera.position.set(state.player.x,1.64,state.player.z);camera.rotation.order='YXZ';camera.rotation.y=state.yaw;camera.rotation.x=state.pitch;
state.near=-1;if(state.active){const target=state.run[state.mission],st=stations[target],dist=Math.hypot(state.player.x-st.x,state.player.z-st.z);if(dist<2.35)state.near=target}if(state.active&&state.near>=0){$('.prompt').innerHTML='<kbd>E</kbd> INSPECT CASE';$('#active-copy').textContent=`${missionDefs[state.run[state.mission]].plot[state.step]} · Active terminal nearby — press E.`}
renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
