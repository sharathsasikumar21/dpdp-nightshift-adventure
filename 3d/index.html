<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07121a"><meta name="description" content="One city. Ten privacy incidents. Your call. A 3D DPDP investigation game for 1–3 players."><title>DPDP Nightshift — The city is still collecting.</title><link rel="stylesheet" href="style.css?v=film1"><link rel="icon" href="icon.svg" type="image/svg+xml"></head>
<body><canvas id="world" tabindex="0" aria-label="3D operations floor. WASD to move, drag to look, Q and R to turn, E to inspect."></canvas><div class="grain" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<header><a class="brand" href="./"><span class="brand-icon">N<span>_</span></span><span>DPDP <b>NIGHTSHIFT</b><small>PRIVACY INCIDENT RESPONSE UNIT</small></span></a><div class="header-right"><span class="live"><i></i> OPERATIONS ONLINE</span><button id="audio" class="small" aria-label="Toggle sound">SOUND ON</button><button id="quality" class="small">LOW FX</button><button id="help" class="small">FIELD GUIDE</button><button id="exit" class="small" hidden>EXIT</button></div></header>
<main id="ui"><p class="loading">BOOTING NIGHTSHIFT…</p></main>
<section id="hud" hidden><div class="metrics"><div>POINTS<b id="points">0</b></div><div>INTEGRITY<b id="integrity">70</b></div><div>STREAK<b id="streak">0</b></div><div>LEVEL<b id="level">Desk Rookie</b></div></div><div class="field-bottom"><div class="objective"><span class="eyebrow" id="sector"></span><h2 id="objective"></h2><p id="bearing"></p><div class="row"><button id="inspect" class="primary">INSPECT TERMINAL [E]</button><button id="guide" class="small">NAVIGATE TO CASE</button><button id="scan" class="small">SCAN ROOM</button></div></div><div class="controls"><span>W A S D / ARROWS · MOVE</span><span>DRAG · LOOK 360° &nbsp; Q / R · TURN</span><span>CLICK OBJECTS · DRONES / CITY MAP / COFFEE</span><button id="quit" class="small">END SHIFT</button></div></div></section>
<div id="mobile"><button data-key="w" aria-label="Move forward">↑</button><button data-key="a" aria-label="Move left">←</button><button data-key="s" aria-label="Move backward">↓</button><button data-key="d" aria-label="Move right">→</button></div><div id="toast" role="status"></div><noscript>This game needs JavaScript enabled.</noscript>
<script src="vendor/supabase.js"></script><script src="supabase-config.js"></script><script type="module" src="app.js?v=film1"></script></body></html>
